version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        # Vite のビルド出力。素の静的サイトのため Amplify Hosting は自動的に
        # 静的ホスティング(WEB platform)として扱う。SSR compute の判定に引っかからない。
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
